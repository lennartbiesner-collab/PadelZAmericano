<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padel Americano</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#17211b;--mute:#6a766d;--line:#dde3dc;--acc:#1f9d55;--acc2:#e8f6ee;--warn:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101512;--card:#19201b;--ink:#eef3ee;--mute:#92a096;--line:#2a342d;--acc:#3ecf7c;--acc2:#15291d;--warn:#ff7b6b}}
:root[data-theme="dark"]{--bg:#101512;--card:#19201b;--ink:#eef3ee;--mute:#92a096;--line:#2a342d;--acc:#3ecf7c;--acc2:#15291d;--warn:#ff7b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 14px}h2{font-size:19px;margin:0 0 10px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab,.chip,button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 16px;min-height:48px;cursor:pointer}
.tab{flex:1;font-weight:600}.tab.on,.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;width:100%}
button.sec{background:transparent}button.dng{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin:12px 0 6px}
textarea,input{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
textarea{min-height:200px;resize:vertical}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mute{color:var(--mute);font-size:15px}.err{color:var(--warn);font-weight:600;margin:10px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.chip{flex:0 0 auto;min-width:56px;padding:10px 14px}
.courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.match{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.match h3{margin:0 0 8px;font-size:15px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.team{display:flex;align-items:center;gap:10px;padding:8px 0}
.team+.team{border-top:1px dashed var(--line)}
.team .n{flex:1;font-weight:600}
.team input{width:84px;text-align:center;font-size:22px;font-weight:700;padding:10px}
.vs{text-align:center;color:var(--mute);font-size:13px;margin:-2px 0}
.pause{background:var(--acc2);border-radius:12px;padding:10px 14px;margin-top:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--mute);text-transform:uppercase}
td.nm,th.nm{text-align:left;font-weight:600}
tr.top td{background:var(--acc2)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
</style>
</head>
<body>
<div class="wrap">
<h1>🎾 Padel Americano</h1>
<div class="mute" id="sync" style="margin:-8px 0 12px"></div>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</div>
<script>
const KEY="padel-americano-v1";
let S={players:"",courts:2,points:24,rounds:6,schedule:[],tab:"setup",round:0,err:"",ts:0};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
let cloud=null,pushT=null;
function setSync(t){const e=document.getElementById("sync");if(e)e.textContent=t}
function local(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S.ts=Date.now();local();clearTimeout(pushT);pushT=setTimeout(push,500)}
async function push(){
  clearTimeout(pushT);if(!cloud)return;
  try{await cloud.set({state:JSON.stringify(S),ts:S.ts||Date.now()});setSync("☁️ Turnier gesichert")}catch(e){setSync("⚠️ Online-Sicherung fehlgeschlagen – lokal gespeichert")}
}
document.addEventListener("visibilitychange",()=>{if(document.hidden){local();push()}});
window.addEventListener("pagehide",()=>{local();push()});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const names=()=>S.players.split("\n").map(s=>s.trim()).filter(Boolean);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pk=(a,b)=>a<b?a+"-"+b:b+"-"+a;

function history(upTo,n){
  const partner={},opp={},games=Array(n).fill(0),lastSit=Array(n).fill(-1);
  for(let r=0;r<upTo;r++){const R=S.schedule[r];
    R.pause.forEach(p=>{lastSit[p]=r});
    R.matches.forEach(m=>{
      partner[pk(m.t1[0],m.t1[1])]=(partner[pk(m.t1[0],m.t1[1])]||0)+1;
      partner[pk(m.t2[0],m.t2[1])]=(partner[pk(m.t2[0],m.t2[1])]||0)+1;
      m.t1.forEach(a=>m.t2.forEach(b=>{opp[pk(a,b)]=(opp[pk(a,b)]||0)+1}));
      m.t1.concat(m.t2).forEach(p=>{games[p]++});
    });}
  return {partner,opp,games,lastSit};
}
function genRound(n,courts,h){
  const need=courts*4,nSit=n-need;
  /* Pausieren: wer die meisten Spiele hat; bei Gleichstand wer am längsten nicht pausiert hat; dann Zufall */
  const order=shuffle([...Array(n).keys()]).sort((a,b)=>(h.games[b]-h.games[a])||(h.lastSit[a]-h.lastSit[b]));
  const pause=order.slice(0,nSit),active=order.slice(nSit);
  let best=null,bestCost=1e9;
  for(let it=0;it<400;it++){
    const sh=shuffle(active),matches=[];let cost=0;
    for(let c=0;c<courts;c++){
      const [a,b,x,y]=sh.slice(c*4,c*4+4);
      const opts=[[[a,b],[x,y]],[[a,x],[b,y]],[[a,y],[b,x]]];
      let bo=null,bc=1e9;
      for(const [t1,t2] of opts){
        let k=(h.partner[pk(t1[0],t1[1])]||0)*100+(h.partner[pk(t2[0],t2[1])]||0)*100;
        t1.forEach(p=>t2.forEach(q=>{k+=(h.opp[pk(p,q)]||0)*10}));
        k+=Math.random();
        if(k<bc){bc=k;bo=[t1,t2]}
      }
      cost+=bc;matches.push({court:c+1,t1:bo[0],t2:bo[1],s1:null,s2:null});
    }
    if(cost<bestCost){bestCost=cost;best=matches}
    if(cost<1)break;
  }
  return {matches:best,pause};
}
function buildFrom(start){
  const n=names().length,ec=Math.min(S.courts,Math.floor(n/4));
  S.schedule=S.schedule.slice(0,start);
  for(let r=start;r<S.rounds;r++){
    S.schedule.push(genRound(n,ec,history(r,n)));
  }
}
function start(){
  const ps=names(),n=ps.length;
  const uniq=new Set(ps.map(p=>p.toLowerCase()));
  S.courts=Math.max(1,parseInt(S.courts)||1);S.points=Math.max(1,parseInt(S.points)||1);S.rounds=Math.max(1,parseInt(S.rounds)||1);
  if(n<4){S.err="Mindestens 4 Spieler nötig.";return render()}
  if(uniq.size!==n){S.err="Bitte jeden Namen nur einmal verwenden.";return render()}
  const maxC=Math.floor(n/4);
  if(S.courts>maxC){S.err="Mit "+n+" Spielern sind maximal "+maxC+" Court(s) möglich (4 Spieler pro Court).";return render()}
  S.err="";S.schedule=[];buildFrom(0);S.round=0;S.tab="rounds";save();render();
}
function resetAll(){
  if(!confirm("Turnier wirklich beenden und neu einrichten? Alle Ergebnisse gehen verloren."))return;
  S.schedule=[];S.tab="setup";save();render();
}
function setScore(r,m,side,val){
  const M=S.schedule[r].matches[m];
  const v=val===""?null:Math.max(0,Math.min(S.points,parseInt(val)));
  if(v===null){M.s1=null;M.s2=null}
  else if(side===1){M.s1=v;M.s2=S.points-v}
  else{M.s2=v;M.s1=S.points-v}
  save();render();
}
function reshuffle(){
  const r=S.round;
  for(let i=r;i<S.schedule.length;i++)if(S.schedule[i].matches.some(m=>m.s1!==null)){
    alert("Ab dieser Runde sind schon Ergebnisse eingetragen – neu auslosen nicht möglich.");return}
  buildFrom(r);save();render();
}
function addPlayer(){
  const nm=document.getElementById("np").value.trim();
  if(!nm)return;
  const ps=names();
  if(ps.some(p=>p.toLowerCase()===nm.toLowerCase())){S.msg="⚠️ Diesen Namen gibt es schon.";return render()}
  S.players=ps.concat(nm).join("\n");
  let last=-1;S.schedule.forEach((R,i)=>{if(R.matches.some(m=>m.s1!==null))last=i});
  const from=last+1;
  if(from>=S.schedule.length){S.msg="✅ "+nm+" ist dabei. Alle bisherigen Runden sind schon gespielt – mit „+ Weitere Runde“ spielt er mit."}
  else{buildFrom(from);S.round=from;S.msg="✅ "+nm+" ist dabei. Runde "+(from+1)+" bis "+S.schedule.length+" wurden neu ausgelost; "+nm+" bekommt vorrangig Spiele, damit am Ende alle ähnlich viele haben."}
  save();render();
}
function addRound(){
  const n=names().length,ec=Math.min(S.courts,Math.floor(n/4));
  S.schedule.push(genRound(n,ec,history(S.schedule.length,n)));
  S.rounds=S.schedule.length;S.round=S.schedule.length-1;save();render();
}
function standings(){
  const ps=names(),T=ps.map((n,i)=>({i,n,pts:0,w:0,l:0,d:0,g:0}));
  S.schedule.forEach(R=>R.matches.forEach(m=>{
    if(m.s1===null)return;
    const add=(t,s,o)=>t.forEach(p=>{const x=T[p];x.pts+=s;x.g++;if(s>o)x.w++;else if(s<o)x.l++;else x.d++});
    add(m.t1,m.s1,m.s2);add(m.t2,m.s2,m.s1);
  }));
  return T.sort((a,b)=>b.pts-a.pts||b.w-a.w||a.n.localeCompare(b.n));
}
function render(){
  const has=S.schedule.length>0;
  const tabs=[["setup","Einrichtung"],["rounds","Runden"],["table","Rangliste"]];
  document.getElementById("tabs").innerHTML=tabs.map(([k,l])=>
    `<button class="tab ${S.tab===k?"on":""}" ${k!=="setup"&&!has?"disabled style='opacity:.4'":""} onclick="S.tab='${k}';save();render()">${l}</button>`).join("");
  const v=document.getElementById("view");
  if(S.tab==="setup"||!has){
    const n=names().length;
    v.innerHTML=`<div class="card"><h2>Spieler</h2>
      <label for="pl">Namen (einer pro Zeile) – aktuell: ${n}</label>
      <textarea id="pl" placeholder="Anna&#10;Ben&#10;Chris&#10;Dana" oninput="S.players=this.value;save();document.getElementById('cnt').textContent=names().length+' Spieler'">${esc(S.players)}</textarea>
      <div class="mute" id="cnt" style="margin-top:6px">${n} Spieler</div></div>
      <div class="card"><h2>Einstellungen</h2><div class="grid3">
      <div><label for="c">Courts</label><input id="c" type="number" inputmode="numeric" min="1" value="${S.courts}" onchange="S.courts=this.value"></div>
      <div><label for="p">Ballwechsel/Punkte</label><input id="p" type="number" inputmode="numeric" min="1" value="${S.points}" onchange="S.points=this.value"></div>
      <div><label for="r">Runden</label><input id="r" type="number" inputmode="numeric" min="1" value="${S.rounds}" onchange="S.rounds=this.value"></div></div>
      <p class="mute">Pro Match werden insgesamt so viele Ballwechsel gespielt; die Punkte beider Teams ergeben zusammen diese Zahl. Wer nicht auf einen Court passt, pausiert (bei 15 Spielern und 3 Courts z. B. 3 zufällige Spieler). Pausiert wird bevorzugt, wer schon die meisten Spiele hat; wer gerade pausiert hat, spielt in der nächsten Runde.</p>
      ${S.err?`<div class="err">${esc(S.err)}</div>`:""}
      <button class="pri" onclick="S.courts=document.getElementById('c').value;S.points=document.getElementById('p').value;S.rounds=document.getElementById('r').value;S.players=document.getElementById('pl').value;start()">${has?"Neu auslosen & starten":"Turnier auslosen & starten"}</button>
      ${has?`<button class="sec dng" style="width:100%;margin-top:10px" onclick="resetAll()">Turnier zurücksetzen</button>`:""}</div>`;
    return;
  }
  const ps=names();
  if(S.tab==="rounds"){
    const R=S.schedule[S.round];const msg=S.msg||"";S.msg="";
    const chips=S.schedule.map((_,i)=>`<button class="chip ${i===S.round?"on":""}" onclick="S.round=${i};save();render()">R${i+1}</button>`).join("");
    const nm=t=>t.map(p=>esc(ps[p])).join(" &amp; ");
    const cards=R.matches.map((m,mi)=>`<div class="match"><h3>Court ${m.court}</h3>
      <div class="team"><div class="n">${nm(m.t1)}</div><input type="number" inputmode="numeric" min="0" max="${S.points}" value="${m.s1===null?"":m.s1}" onchange="setScore(${S.round},${mi},1,this.value)"></div>
      <div class="vs">gegen</div>
      <div class="team"><div class="n">${nm(m.t2)}</div><input type="number" inputmode="numeric" min="0" max="${S.points}" value="${m.s2===null?"":m.s2}" onchange="setScore(${S.round},${mi},2,this.value)"></div></div>`).join("");
    v.innerHTML=`<div class="chips">${chips}</div><div class="card"><h2>Runde ${S.round+1} von ${S.schedule.length}</h2>
      <div class="courts">${cards}</div>
      ${R.pause.length?`<div class="pause"><b>Pause:</b> ${R.pause.map(p=>esc(ps[p])).join(", ")}</div>`:""}
      <div class="row" style="margin-top:14px"><button onclick="reshuffle()">🔀 Diese Runde neu auslosen</button>
      <button class="sec" ${S.round===0?"disabled":""} onclick="S.round--;save();render()">← Zurück</button>
      <button class="sec" ${S.round>=S.schedule.length-1?"disabled":""} onclick="S.round++;save();render()">Weiter →</button></div>
      <p class="mute">Trage die Punkte eines Teams ein – das andere Team wird automatisch ergänzt.</p></div>
      <div class="card"><h2>Spieler nachträglich hinzufügen</h2>${msg?`<div class="pause" style="margin:0 0 10px">${esc(msg)}</div>`:""}
      <div class="row"><input id="np" placeholder="Name" onkeydown="if(event.key==='Enter')addPlayer()"><button class="pri" style="width:auto;flex:0 0 auto" onclick="addPlayer()">Hinzufügen</button></div>
      <p class="mute">Alle Runden ohne eingetragene Ergebnisse werden neu ausgelost.</p>
      <button class="sec" onclick="addRound()">+ Weitere Runde</button></div>`;
    return;
  }
  const T=standings();
  v.innerHTML=`<div class="card"><h2>Rangliste</h2><table><tr><th>#</th><th class="nm">Spieler</th><th>Punkte</th><th>Spiele</th><th>S</th><th>U</th><th>N</th></tr>
    ${T.map((x,i)=>`<tr class="${i<3&&x.g?"top":""}"><td>${i+1}</td><td class="nm">${esc(x.n)}</td><td><b>${x.pts}</b></td><td>${x.g}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td></tr>`).join("")}</table>
    <p class="mute">Gewertet wird die Summe der selbst erspielten Punkte; bei Gleichstand zählen Siege.</p></div>`;
}
render();
(async()=>{
  try{
    if(typeof claude==='undefined'){setSync("Nur auf diesem Gerät gespeichert");return}
    const db=await claude.use("db"),user=await claude.use("user");
    const id=user?await user.id():null;
    if(!db||!id){setSync("Nur auf diesem Gerät gespeichert");return}
    cloud=db.collection("data/users/"+id).doc("tournament");
    const snap=await cloud.get(),d=snap.exists?snap.data():null;
    if(d&&d.state&&(d.ts||0)>(S.ts||0)){
      S=Object.assign({},S,JSON.parse(d.state));local();render();setSync("☁️ Turnier wiederhergestellt");
    }else if(S.players||S.schedule.length){await push()}
    else setSync("☁️ Online-Sicherung aktiv");
  }catch(e){setSync("Nur auf diesem Gerät gespeichert")}
})();
</script>
</body>
</html>
